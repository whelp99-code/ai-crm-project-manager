# Grafana dashboard provisioning (D12) — loads every dashboard JSON under
# ops/grafana/dashboards (mounted read-only into the container) on startup.
apiVersion: 1

providers:
  - name: "ai-crm"
    orgId: 1
    folder: "AI-CRM"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
