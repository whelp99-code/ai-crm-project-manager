# Prometheus scrape config for the AI-CRM API `/metrics` endpoint.
#
# The AI-CRM API is host-run (process-local, per docs/ops/compose.md), so the
# Prometheus container reaches it via `host.docker.internal`. Target port
# 3001 matches the port documented in docs/ops/compose.md for a host-run
# `apps/api` and the port packages/persistence/scripts/prom-scrape-drill.sh
# starts its scrape-proof harness on. Override by editing this file (and the
# AI_CRM_API_PORT env passed to the drill script) if you run the API on a
# different port.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

# Alerting rules (D12) — see ops/prometheus/alerts.yml (production rules)
# and ops/prometheus/alerts-test.yml (a fast-firing test-only mirror used by
# ops/obs-stack-drill.sh). Loaded rules are visible at GET /api/v1/rules on
# the running Prometheus.
rule_files:
  - "/etc/prometheus/alerts.yml"
  - "/etc/prometheus/alerts-test.yml"

# Alertmanager (D12/PG-F) — routes fired alerts to the notification
# receiver configured in ops/alertmanager/alertmanager.yml. `alertmanager`
# resolves via the compose network (see docker-compose.observability.yml).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "ai-crm-api"
    scrape_interval: 5s
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["host.docker.internal:3001"]
        labels:
          service: "ai-crm-api"
