# Prometheus alerting rules over ai_crm_* metrics (D12).
#
# Wired via `rule_files:` in ops/prometheus/prometheus.yml. Loaded rules are
# visible at GET /api/v1/rules on the running Prometheus (see
# ops/obs-stack-drill.sh for a live assertion).
#
# Alertmanager IS deployed alongside this (see docker-compose.observability.yml,
# the `alertmanager` service) and Prometheus is wired to it via
# `alerting.alertmanagers` in ops/prometheus/prometheus.yml. Fired alerts are
# routed to Alertmanager, which notifies a locally-assertable webhook
# receiver (see docs/ops/observability.md, "Alertmanager + persistence
# (PG-F / D12 extension)", and ops/obs-stack-drill.sh for a live proof).
groups:
  - name: ai-crm.rules
    rules:
      - alert: AiCrmApiDown
        expr: up{job="ai-crm-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AI-CRM API scrape target is down"
          description: >-
            Prometheus has not been able to scrape the ai-crm-api target for
            at least 1 minute. The API process may be down or unreachable
            from the Prometheus container.

      - alert: AiCrmDualWriteFailures
        expr: ai_crm_dual_write_failures > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "AI-CRM dual-write failures observed"
          description: >-
            ai_crm_dual_write_failures has been greater than 0 for at least
            1 minute, indicating the best-effort dual-write path is failing
            for at least one workspace/control.
