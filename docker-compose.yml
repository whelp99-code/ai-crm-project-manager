services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ai_crm
      POSTGRES_USER: ai_crm
      POSTGRES_PASSWORD: ai_crm_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_crm -d ai_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: {}
