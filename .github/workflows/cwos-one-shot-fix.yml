name: CWOS One Shot Type Repair

on:
  push:
    branches:
      - feat/customer-work-os-v1-full

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-work-os-v1-full
          fetch-depth: 0
      - name: Patch verified TypeScript findings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          customer = Path('packages/domain/src/customer-work-os.ts')
          text = customer.read_text()
          replacements = {
              'const serialized = JSON.stringify(canonicalize(value));': 'const serialized = JSON.stringify(canonicalize(value)) ?? "undefined";',
              '    engagement.terminalReason = reason?.trim();': '    if (reason?.trim()) engagement.terminalReason = reason.trim();\n    else delete engagement.terminalReason;',
          }
          for old, new in replacements.items():
              if old not in text and new not in text:
                  raise SystemExit(f'customer-work-os expected text not found: {old}')
              text = text.replace(old, new)
          customer.write_text(text)

          graph = Path('packages/domain/src/workflow-graph.ts')
          text = graph.read_text()
          old_handler = ': await handler!({ run: clone(run), node: clone(node), now, approvalReceipt });'
          new_handler = ''': await handler!({
            run: clone(run),
            node: clone(node),
            now,
            ...(approvalReceipt !== undefined ? { approvalReceipt } : {}),
          });'''
          if old_handler not in text and new_handler not in text:
              raise SystemExit('workflow handler invocation not found')
          text = text.replace(old_handler, new_handler)
          text = text.replace(
              '        failureSignature: result.failureSignature,',
              '        ...(result.failureSignature !== undefined ? { failureSignature: result.failureSignature } : {}),',
          )
          text = text.replace(
              '        message: result.message,',
              '        ...(result.message !== undefined ? { message: result.message } : {}),',
          )
          graph.write_text(text)

          test = Path('packages/domain/test/workflow-graph.unit.test.ts')
          text = test.read_text()
          old = '.rejects.toMatchObject<Partial<WorkflowGraphError>>({ code: "STALE_APPROVAL" });'
          new = '.rejects.toMatchObject({ code: "STALE_APPROVAL" });'
          if old not in text and new not in text:
              raise SystemExit('workflow test matcher not found')
          test.write_text(text.replace(old, new))

          Path('.github/workflows/cwos-one-shot-fix.yml').unlink()
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/domain/src/customer-work-os.ts packages/domain/src/workflow-graph.ts packages/domain/test/workflow-graph.unit.test.ts .github/workflows/cwos-one-shot-fix.yml
          git commit -m "fix(cwos): satisfy exact optional property contracts"
          git push origin HEAD:feat/customer-work-os-v1-full
