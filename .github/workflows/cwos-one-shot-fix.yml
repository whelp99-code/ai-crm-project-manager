name: CWOS One Shot Strict Null Fix

on:
  push:
    branches:
      - feat/customer-work-os-v1-full

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix(cwos): normalize JSON serialization') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-work-os-v1-full
          fetch-depth: 0
      - name: Apply exact strict-null patch
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('packages/domain/src/customer-work-os.ts')
          text = source.read_text()
          old = 'const serialized = JSON.stringify(canonicalize(value));'
          new = 'const serialized = JSON.stringify(canonicalize(value)) ?? "undefined";'
          if old not in text and new not in text:
              raise SystemExit('expected serialization line not found')
          source.write_text(text.replace(old, new))
          Path('.github/workflows/cwos-one-shot-fix.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/domain/src/customer-work-os.ts .github/workflows/cwos-one-shot-fix.yml
          git commit -m "fix(cwos): normalize JSON serialization"
          git push origin HEAD:feat/customer-work-os-v1-full
