name: CWOS One Shot Cockpit UI

on:
  push:
    branches:
      - feat/customer-work-os-v1-full

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'feat(cwos): surface global owner cockpit') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-work-os-v1-full
          fetch-depth: 0
      - name: Patch global cockpit UI
        run: |
          python - <<'PY'
          from pathlib import Path
          roots = [Path('apps/web/src/app/customer-work-os/page.tsx'), Path('apps/web/app/customer-work-os/page.tsx')]
          path = next((candidate for candidate in roots if candidate.exists()), None)
          if path is None:
              raise SystemExit('Customer Work OS page not found')
          text = path.read_text()
          report_type = '''
type CockpitReport = {
  activeEngagementCount: number;
  warningEngagementCount: number;
  overdueCommitmentCount: number;
  nextActionMissingCount: number;
  receivableKrw: string;
  payableKrw: string;
  cashPositionKrw: string;
  moneyWindows: Array<{ days: number; expectedIncomingKrw: string; expectedOutgoingKrw: string; netKrw: string }>;
  engagements: Array<{ id: string; projectKey: string; name: string; stage: string; health: string; warningCodes: string[]; receivableKrw: string; payableKrw: string; cashPositionKrw: string }>;
  renewals: Array<{ assetId: string; serialOrLicenseKey: string; renewalDate: string; bucket: string }>;
};
'''
          anchor = 'type Snapshot = {'
          if 'type CockpitReport' not in text:
              text = text.replace(anchor, report_type + '\n' + anchor)
          text = text.replace(
              '  const [snapshot, setSnapshot] = useState<Snapshot | null>(null);',
              '  const [snapshot, setSnapshot] = useState<Snapshot | null>(null);\n  const [cockpit, setCockpit] = useState<CockpitReport | null>(null);',
          )
          load_function = '''
  async function loadCockpit() {
    setBusy(true);
    try {
      const response = await fetch(`${apiBase}/api/cwos/cockpit`, { headers: headers() });
      const body = await response.json();
      if (!response.ok) throw new Error(body.message || body.error || "Cockpit 조회 실패");
      setCockpit(body as CockpitReport);
      setMessage("전체 고객·프로젝트·자금 위험을 갱신했습니다.");
    } catch (error) {
      setMessage(error instanceof Error ? error.message : "Cockpit 조회 실패");
    } finally {
      setBusy(false);
    }
  }
'''
          marker = '  async function loadProject(id = engagementId) {'
          if 'async function loadCockpit' not in text:
              text = text.replace(marker, load_function + '\n' + marker)
          old_section = '''        <section style={{ ...panel, display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
          <input style={{ ...input, maxWidth: 360 }} value={engagementId} onChange={(event) => setEngagementId(event.target.value)} placeholder="Engagement ID" />
          <button style={button} disabled={busy} onClick={() => void loadProject()}>{busy ? "처리 중" : "프로젝트 불러오기"}</button>
        </section>'''
          new_section = '''        <section style={{ ...panel, display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
          <button style={button} disabled={busy} onClick={() => void loadCockpit()}>{busy ? "처리 중" : "전체 Cockpit 갱신"}</button>
          <input style={{ ...input, maxWidth: 360 }} value={engagementId} onChange={(event) => setEngagementId(event.target.value)} placeholder="Engagement ID" />
          <button style={button} disabled={busy} onClick={() => void loadProject()}>{busy ? "처리 중" : "프로젝트 360 불러오기"}</button>
        </section>

        {cockpit ? (
          <>
            <section style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 12 }}>
              <Metric label="진행 고객업무" value={`${cockpit.activeEngagementCount}건`} />
              <Metric label="위험 프로젝트" value={`${cockpit.warningEngagementCount}건`} alert={cockpit.warningEngagementCount > 0} />
              <Metric label="기한 지난 약속" value={`${cockpit.overdueCommitmentCount}건`} alert={cockpit.overdueCommitmentCount > 0} />
              <Metric label="다음 행동 없음" value={`${cockpit.nextActionMissingCount}건`} alert={cockpit.nextActionMissingCount > 0} />
              <Metric label="전체 미수금" value={won(cockpit.receivableKrw)} alert={BigInt(cockpit.receivableKrw || "0") > 0n} />
              <Metric label="전체 미지급금" value={won(cockpit.payableKrw)} alert={BigInt(cockpit.payableKrw || "0") > 0n} />
              <Metric label="전체 현금위치" value={won(cockpit.cashPositionKrw)} alert={BigInt(cockpit.cashPositionKrw || "0") < 0n} />
            </section>
            <section style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(320px, 1fr))", gap: 14 }}>
              <div style={panel}>
                <h3>위험 우선 프로젝트</h3>
                {cockpit.engagements.slice(0, 10).map((item) => (
                  <button key={item.id} onClick={() => void loadProject(item.id)} style={{ width: "100%", textAlign: "left", background: "transparent", border: 0, borderBottom: "1px solid #eef0f3", padding: "10px 0", cursor: "pointer" }}>
                    <strong>{item.projectKey} · {item.name}</strong>
                    <div style={{ color: "#667085", fontSize: 13 }}>{item.stage} · {item.warningCodes.join(", ") || "정상"}</div>
                  </button>
                ))}
              </div>
              <div style={panel}>
                <h3>예상 자금흐름</h3>
                {cockpit.moneyWindows.map((window) => <div key={window.days} style={{ display: "grid", gridTemplateColumns: "60px 1fr 1fr", gap: 8, padding: "9px 0", borderBottom: "1px solid #eef0f3" }}><strong>{window.days}일</strong><span>입금 {won(window.expectedIncomingKrw)}</span><span>출금 {won(window.expectedOutgoingKrw)}</span></div>)}
              </div>
              <div style={panel}>
                <h3>갱신 Radar</h3>
                {cockpit.renewals.length === 0 ? <p>90일 이내 갱신 없음</p> : cockpit.renewals.slice(0, 10).map((item) => <div key={item.assetId} style={{ padding: "9px 0", borderBottom: "1px solid #eef0f3" }}><strong>{item.serialOrLicenseKey}</strong><div style={{ color: "#667085", fontSize: 13 }}>{item.renewalDate} · {item.bucket}</div></div>)}
              </div>
            </section>
          </>
        ) : null}'''
          if old_section not in text:
              raise SystemExit('project load section not found')
          text = text.replace(old_section, new_section)
          path.write_text(text)
          Path('.github/workflows/cwos-one-shot-cockpit-ui.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web .github/workflows/cwos-one-shot-cockpit-ui.yml
          git commit -m "feat(cwos): surface global owner cockpit"
          git push origin HEAD:feat/customer-work-os-v1-full
