name: CWOS One Shot API Integration

on:
  push:
    branches:
      - feat/customer-work-os-v1-full

permissions:
  contents: write

concurrency:
  group: cwos-one-shot-api-integration
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'feat(cwos): register routes in primary API host') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-work-os-v1-full
          fetch-depth: 0
      - name: Register plugin in primary host
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/app.ts')
          text = path.read_text()
          import_line = 'import { registerCustomerWorkOsRoutes } from "./customer-work-os-routes.js";\n'
          if import_line not in text:
              anchor = 'import { EventHub } from "./event-hub.js";\n'
              if anchor not in text:
                  raise SystemExit('EventHub import anchor not found')
              text = text.replace(anchor, anchor + import_line)
          call = '  await registerCustomerWorkOsRoutes(app);\n'
          if call not in text:
              anchor = '  return app;'
              position = text.rfind(anchor)
              if position < 0:
                  raise SystemExit('return app anchor not found')
              text = text[:position] + call + text[position:]
          path.write_text(text)
          Path('.github/workflows/cwos-one-shot-api-integration.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/app.ts .github/workflows/cwos-one-shot-api-integration.yml
          git commit -m "feat(cwos): register routes in primary API host"
          git push origin HEAD:feat/customer-work-os-v1-full
