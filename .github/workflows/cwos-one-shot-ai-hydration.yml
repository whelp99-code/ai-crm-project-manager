name: CWOS One Shot AI Hydration

on:
  push:
    branches:
      - feat/customer-work-os-v1-full

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'feat(cwos): add AI suggestion hydration contract') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-work-os-v1-full
          fetch-depth: 0
      - name: Add hydrate and export
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/ai-orchestrator/src/customer-work-os-ai.ts')
          text = path.read_text()
          methods = '''  hydrate(suggestions: readonly AiSuggestion[]): void {
    this.suggestions.clear();
    this.inputCache.clear();
    for (const suggestion of suggestions) {
      if (!suggestion.id.trim() || !suggestion.workspaceId.trim()) throw new CustomerWorkOsAiError("INVALID_STATE", "hydrated suggestion requires id and workspaceId");
      if (this.suggestions.has(suggestion.id)) throw new CustomerWorkOsAiError("DUPLICATE_ID", `duplicate hydrated suggestion: ${suggestion.id}`);
      validateEvidence(suggestion.evidence);
      if (suggestion.confidence < 0 || suggestion.confidence > 1) throw new CustomerWorkOsAiError("INVALID_CONFIDENCE", "hydrated confidence must be 0..1");
      assertUsageShape(suggestion.usage);
      if (suggestion.proposedCommand) validatePreparedCommand(suggestion.proposedCommand);
      if (["ACCEPTED", "REJECTED", "EXPIRED"].includes(suggestion.status) && (!suggestion.reviewedByPrincipalId || !suggestion.reviewReason)) {
        throw new CustomerWorkOsAiError("INVALID_STATE", `terminal suggestion ${suggestion.id} lacks review metadata`);
      }
      this.suggestions.set(suggestion.id, copy(suggestion));
    }
  }

  exportSuggestions(workspaceId: string): AiSuggestion[] {
    return [...this.suggestions.values()]
      .filter((item) => item.workspaceId === workspaceId)
      .sort((left, right) => left.createdAt.localeCompare(right.createdAt) || left.id.localeCompare(right.id))
      .map((item) => copy(item));
  }

'''
          marker = '  async analyzeAndPropose('
          if '  hydrate(suggestions: readonly AiSuggestion[])' not in text:
              if marker not in text:
                  raise SystemExit('analyze method anchor not found')
              text = text.replace(marker, methods + marker)
          path.write_text(text)
          Path('.github/workflows/cwos-one-shot-ai-hydration.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ai-orchestrator .github/workflows/cwos-one-shot-ai-hydration.yml
          git commit -m "feat(cwos): add AI suggestion hydration contract"
          git push origin HEAD:feat/customer-work-os-v1-full
