name: CWOS One Shot Web UI

on:
  push:
    branches:
      - feat/customer-work-os-v1-full

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, 'feat(cwos): add owner cockpit web experience') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-work-os-v1-full
          fetch-depth: 0
      - name: Generate route in detected Next.js app root
        run: |
          python - <<'PY'
          from pathlib import Path
          roots = [Path('apps/web/src/app'), Path('apps/web/app')]
          root = next((candidate for candidate in roots if candidate.exists()), None)
          if root is None:
              raise SystemExit('Next.js app root not found')
          route = root / 'customer-work-os'
          route.mkdir(parents=True, exist_ok=True)
          route.joinpath('page.tsx').write_text(r'''"use client";

import { FormEvent, useMemo, useState } from "react";

type FinanceSummary = {
  expectedRevenueKrw: string;
  billedRevenueKrw: string;
  collectedKrw: string;
  receivableKrw: string;
  estimateAtCompletionKrw: string;
  forecastProfitKrw: string;
  forecastMarginBps: number;
  paidKrw: string;
  payableKrw: string;
  cashPositionKrw: string;
};

type Snapshot = {
  engagement: { id: string; projectKey: string; name: string; type: string; stage: string; health: string; targetDate?: string };
  parties: Array<{ id: string; role: string; accountId: string; primary: boolean }>;
  activities: Array<{ id: string; type: string; occurredAt: string; summary: string }>;
  commitments: Array<{ id: string; description: string; dueAt: string; status: string; priority: number }>;
  quotes: Array<{ id: string; status: string; totalPriceKrw: string; marginBps: number }>;
  contracts: Array<{ id: string; title: string; status: string; contractValueKrw: string }>;
  deliveryProjects: Array<{ id: string; status: string; scheduleEnd: string }>;
  changes: Array<{ id: string; description: string; status: string; priceImpactKrw: string }>;
  purchaseOrders: Array<{ id: string; status: string; vendorAccountId: string }>;
  assets: Array<{ id: string; serialOrLicenseKey: string; status: string; renewalDate?: string }>;
  finance: FinanceSummary;
};

const shell: React.CSSProperties = { minHeight: "100vh", background: "#f4f5f7", color: "#17191c", padding: "24px" };
const panel: React.CSSProperties = { background: "#fff", border: "1px solid #e4e7eb", borderRadius: 16, padding: 18, boxShadow: "0 8px 30px rgba(0,0,0,.04)" };
const input: React.CSSProperties = { width: "100%", padding: "10px 12px", border: "1px solid #d7dbe0", borderRadius: 9, background: "#fff" };
const button: React.CSSProperties = { padding: "10px 14px", borderRadius: 9, border: 0, background: "#17191c", color: "#fff", cursor: "pointer", fontWeight: 700 };

function won(value?: string): string {
  const number = BigInt(value || "0");
  return `${new Intl.NumberFormat("ko-KR").format(number)}원`;
}

function Metric({ label, value, alert = false }: { label: string; value: string; alert?: boolean }) {
  return (
    <div style={{ ...panel, minHeight: 105 }}>
      <div style={{ color: "#68707a", fontSize: 13 }}>{label}</div>
      <div style={{ marginTop: 10, fontSize: 23, fontWeight: 800, color: alert ? "#b42318" : "#17191c" }}>{value}</div>
    </div>
  );
}

export default function CustomerWorkOsPage() {
  const [apiBase, setApiBase] = useState(process.env.NEXT_PUBLIC_API_BASE_URL || "");
  const [apiKey, setApiKey] = useState("");
  const [workspaceId, setWorkspaceId] = useState("00000000-0000-4000-8000-000000000001");
  const [principalId, setPrincipalId] = useState("owner-1");
  const [engagementId, setEngagementId] = useState("");
  const [snapshot, setSnapshot] = useState<Snapshot | null>(null);
  const [message, setMessage] = useState("프로젝트 ID를 입력해 현재 상태를 불러오세요.");
  const [busy, setBusy] = useState(false);

  const headers = (idempotency?: string): Record<string, string> => ({
    "content-type": "application/json",
    "x-workspace-id": workspaceId,
    "x-principal-id": principalId,
    ...(apiKey ? { "x-api-key": apiKey } : {}),
    ...(idempotency ? { "idempotency-key": idempotency } : {}),
  });

  async function loadProject(id = engagementId) {
    if (!id.trim()) return setMessage("프로젝트 ID가 필요합니다.");
    setBusy(true);
    try {
      const response = await fetch(`${apiBase}/api/cwos/engagements/${encodeURIComponent(id)}`, { headers: headers() });
      const body = await response.json();
      if (!response.ok) throw new Error(body.message || body.error || "조회 실패");
      setSnapshot(body as Snapshot);
      setEngagementId(id);
      setMessage("최신 고객·프로젝트·재무 상태를 불러왔습니다.");
    } catch (error) {
      setMessage(error instanceof Error ? error.message : "조회 실패");
    } finally {
      setBusy(false);
    }
  }

  async function createAccount(event: FormEvent<HTMLFormElement>) {
    event.preventDefault();
    const data = new FormData(event.currentTarget);
    setBusy(true);
    try {
      const id = String(data.get("id") || "").trim();
      const response = await fetch(`${apiBase}/api/cwos/accounts`, {
        method: "POST",
        headers: headers(`ui-account-${id}`),
        body: JSON.stringify({ id, name: String(data.get("name") || ""), kinds: [String(data.get("kind") || "customer")], status: "active" }),
      });
      const body = await response.json();
      if (!response.ok) throw new Error(body.message || body.error || "고객 등록 실패");
      setMessage(`고객 ${body.name}을 등록했습니다.`);
      event.currentTarget.reset();
    } catch (error) {
      setMessage(error instanceof Error ? error.message : "고객 등록 실패");
    } finally {
      setBusy(false);
    }
  }

  async function createEngagement(event: FormEvent<HTMLFormElement>) {
    event.preventDefault();
    const data = new FormData(event.currentTarget);
    setBusy(true);
    try {
      const id = String(data.get("id") || "").trim();
      const response = await fetch(`${apiBase}/api/cwos/engagements`, {
        method: "POST",
        headers: headers(`ui-engagement-${id}`),
        body: JSON.stringify({
          id,
          projectKey: String(data.get("projectKey") || ""),
          name: String(data.get("name") || ""),
          type: String(data.get("type") || "opportunity"),
          stage: "INQUIRY",
          health: "normal",
          targetDate: String(data.get("targetDate") || "") || undefined,
        }),
      });
      const body = await response.json();
      if (!response.ok) throw new Error(body.message || body.error || "프로젝트 등록 실패");
      setMessage(`프로젝트 ${body.projectKey}를 등록했습니다. 다음 행동을 연결하세요.`);
      setEngagementId(body.id);
      event.currentTarget.reset();
    } catch (error) {
      setMessage(error instanceof Error ? error.message : "프로젝트 등록 실패");
    } finally {
      setBusy(false);
    }
  }

  const warnings = useMemo(() => {
    if (!snapshot) return [] as string[];
    const items: string[] = [];
    if (snapshot.commitments.filter((item) => !["DONE", "CANCELLED"].includes(item.status)).length === 0 && snapshot.engagement.stage !== "CLOSED") items.push("진행 프로젝트에 열린 다음 행동이 없습니다.");
    if (BigInt(snapshot.finance.receivableKrw || "0") > 0n) items.push(`미수금 ${won(snapshot.finance.receivableKrw)}이 남아 있습니다.`);
    if (BigInt(snapshot.finance.payableKrw || "0") > 0n) items.push(`미지급금 ${won(snapshot.finance.payableKrw)}이 남아 있습니다.`);
    if (snapshot.finance.forecastMarginBps < 1000) items.push("예상 이익률이 10% 미만입니다.");
    if (snapshot.changes.some((item) => !["REJECTED", "APPLIED"].includes(item.status))) items.push("처리되지 않은 변경요청이 있습니다.");
    return items;
  }, [snapshot]);

  return (
    <main style={shell}>
      <div style={{ maxWidth: 1440, margin: "0 auto", display: "grid", gap: 18 }}>
        <header style={{ display: "flex", justifyContent: "space-between", gap: 20, alignItems: "flex-start", flexWrap: "wrap" }}>
          <div>
            <div style={{ fontSize: 13, color: "#667085", fontWeight: 700 }}>JM AI-NATIVE CUSTOMER WORK OS</div>
            <h1 style={{ margin: "6px 0", fontSize: 34 }}>대표 Cockpit</h1>
            <p style={{ margin: 0, color: "#667085" }}>고객·영업·프로젝트·구매·자산·돈의 흐름을 한 프로젝트 번호로 연결합니다.</p>
          </div>
          <div style={{ ...panel, minWidth: 330, display: "grid", gap: 8 }}>
            <input aria-label="API Base" style={input} value={apiBase} onChange={(event) => setApiBase(event.target.value)} placeholder="API Base URL (동일 출처면 비움)" />
            <input aria-label="API Key" style={input} value={apiKey} onChange={(event) => setApiKey(event.target.value)} placeholder="API Key" type="password" />
            <input aria-label="Workspace ID" style={input} value={workspaceId} onChange={(event) => setWorkspaceId(event.target.value)} placeholder="Workspace ID" />
            <input aria-label="Principal ID" style={input} value={principalId} onChange={(event) => setPrincipalId(event.target.value)} placeholder="Principal ID" />
          </div>
        </header>

        <div role="status" style={{ ...panel, borderColor: message.includes("실패") || message.includes("필요") ? "#f5b7b1" : "#bee3f8", background: "#f8fbff" }}>{message}</div>

        <section style={{ ...panel, display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
          <input style={{ ...input, maxWidth: 360 }} value={engagementId} onChange={(event) => setEngagementId(event.target.value)} placeholder="Engagement ID" />
          <button style={button} disabled={busy} onClick={() => void loadProject()}>{busy ? "처리 중" : "프로젝트 불러오기"}</button>
        </section>

        {snapshot ? (
          <>
            <section style={{ ...panel, display: "grid", gap: 10 }}>
              <div style={{ display: "flex", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
                <div>
                  <div style={{ color: "#667085", fontSize: 13 }}>{snapshot.engagement.projectKey}</div>
                  <h2 style={{ margin: "4px 0" }}>{snapshot.engagement.name}</h2>
                </div>
                <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <span style={{ padding: "6px 10px", borderRadius: 999, background: "#eef2ff", fontWeight: 700 }}>{snapshot.engagement.stage}</span>
                  <span style={{ padding: "6px 10px", borderRadius: 999, background: snapshot.engagement.health === "critical" ? "#fee4e2" : "#ecfdf3", fontWeight: 700 }}>{snapshot.engagement.health}</span>
                </div>
              </div>
              {warnings.length > 0 && <div style={{ background: "#fff7ed", border: "1px solid #fed7aa", borderRadius: 12, padding: 14 }}><strong>확인 필요</strong><ul>{warnings.map((item) => <li key={item}>{item}</li>)}</ul></div>}
            </section>

            <section style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(190px, 1fr))", gap: 12 }}>
              <Metric label="예상 매출" value={won(snapshot.finance.expectedRevenueKrw)} />
              <Metric label="완료예상원가" value={won(snapshot.finance.estimateAtCompletionKrw)} />
              <Metric label="예상 최종이익" value={won(snapshot.finance.forecastProfitKrw)} alert={BigInt(snapshot.finance.forecastProfitKrw || "0") < 0n} />
              <Metric label="예상 이익률" value={`${(snapshot.finance.forecastMarginBps / 100).toFixed(1)}%`} alert={snapshot.finance.forecastMarginBps < 1000} />
              <Metric label="미수금" value={won(snapshot.finance.receivableKrw)} alert={BigInt(snapshot.finance.receivableKrw || "0") > 0n} />
              <Metric label="미지급금" value={won(snapshot.finance.payableKrw)} alert={BigInt(snapshot.finance.payableKrw || "0") > 0n} />
              <Metric label="현재 프로젝트 현금" value={won(snapshot.finance.cashPositionKrw)} alert={BigInt(snapshot.finance.cashPositionKrw || "0") < 0n} />
            </section>

            <section style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(310px, 1fr))", gap: 14 }}>
              <div style={panel}><h3>다음 행동</h3>{snapshot.commitments.length === 0 ? <p>등록된 행동 없음</p> : <ol>{snapshot.commitments.slice(0, 8).map((item) => <li key={item.id} style={{ marginBottom: 10 }}><strong>{item.description}</strong><div style={{ color: "#667085", fontSize: 13 }}>{item.dueAt} · {item.status}</div></li>)}</ol>}</div>
              <div style={panel}><h3>최근 고객 활동</h3>{snapshot.activities.length === 0 ? <p>등록된 활동 없음</p> : <ol>{snapshot.activities.slice(0, 8).map((item) => <li key={item.id} style={{ marginBottom: 10 }}><strong>{item.summary}</strong><div style={{ color: "#667085", fontSize: 13 }}>{item.occurredAt} · {item.type}</div></li>)}</ol>}</div>
              <div style={panel}><h3>수행·구매·자산</h3><p>수행 프로젝트 {snapshot.deliveryProjects.length}건</p><p>변경요청 {snapshot.changes.length}건</p><p>발주 {snapshot.purchaseOrders.length}건</p><p>고객 자산·라이선스 {snapshot.assets.length}건</p></div>
            </section>
          </>
        ) : null}

        <section style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(330px, 1fr))", gap: 14 }}>
          <form onSubmit={createAccount} style={{ ...panel, display: "grid", gap: 10 }}>
            <h3 style={{ margin: 0 }}>빠른 고객·파트너 등록</h3>
            <input name="id" style={input} placeholder="고유 ID" required />
            <input name="name" style={input} placeholder="회사·조직명" required />
            <select name="kind" style={input} defaultValue="customer"><option value="customer">고객</option><option value="partner">파트너</option><option value="vendor">벤더</option><option value="manufacturer">제조사</option><option value="outsourcer">외주</option></select>
            <button style={button} disabled={busy}>등록</button>
          </form>
          <form onSubmit={createEngagement} style={{ ...panel, display: "grid", gap: 10 }}>
            <h3 style={{ margin: 0 }}>빠른 고객업무·프로젝트 등록</h3>
            <input name="id" style={input} placeholder="Engagement ID" required />
            <input name="projectKey" style={input} placeholder="PRJ-2026-001" required />
            <input name="name" style={input} placeholder="고객사 + 업무명" required />
            <select name="type" style={input} defaultValue="opportunity"><option value="inquiry">문의</option><option value="opportunity">영업기회</option><option value="consulting">컨설팅</option><option value="delivery">구축</option><option value="support">지원</option><option value="maintenance">유지보수</option><option value="renewal">갱신</option></select>
            <input name="targetDate" style={input} type="date" />
            <button style={button} disabled={busy}>프로젝트 생성</button>
          </form>
        </section>
      </div>
    </main>
  );
}
''')
          Path('.github/workflows/cwos-one-shot-web-ui.yml').unlink()
          PY
      - name: Commit generated UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web .github/workflows/cwos-one-shot-web-ui.yml
          git commit -m "feat(cwos): add owner cockpit web experience"
          git push origin HEAD:feat/customer-work-os-v1-full
