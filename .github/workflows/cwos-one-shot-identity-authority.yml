name: CWOS One Shot Identity Authority

on:
  push:
    branches:
      - feat/customer-work-os-v1-full

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix(cwos): enforce human authority on public mutations') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-work-os-v1-full
          fetch-depth: 0
      - name: Enforce public mutation authority
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/customer-work-os-routes-durable.ts')
          text = path.read_text()
          old = '''      if (!identity.active || identity.workspaceId !== workspaceId || identity.principalId !== principalId) throw new CustomerWorkOsError("PRINCIPAL_BINDING_FAILED", "request identity does not match the workspace principal registry");
      requestIdentities.set(request, identity);'''
          new = '''      if (!identity.active || identity.workspaceId !== workspaceId || identity.principalId !== principalId) throw new CustomerWorkOsError("PRINCIPAL_BINDING_FAILED", "request identity does not match the workspace principal registry");
      const nonHumanMutationAllowlist = [
        "/api/cwos/governance/requests",
        "/api/cwos/ai/suggestions",
      ];
      if (request.method !== "GET" && identity.kind !== "HUMAN" && !nonHumanMutationAllowlist.some((path) => request.url === path || request.url.startsWith(`${path}/`))) {
        throw new CustomerWorkOsError("HUMAN_AUTHORITY_REQUIRED", "public Customer Work OS mutation requires a human principal");
      }
      requestIdentities.set(request, identity);'''
          if old not in text:
              raise SystemExit('identity binding anchor not found')
          text = text.replace(old, new)
          path.write_text(text)
          Path('.github/workflows/cwos-one-shot-identity-authority.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/customer-work-os-routes-durable.ts .github/workflows/cwos-one-shot-identity-authority.yml
          git commit -m "fix(cwos): enforce human authority on public mutations"
          git push origin HEAD:feat/customer-work-os-v1-full
