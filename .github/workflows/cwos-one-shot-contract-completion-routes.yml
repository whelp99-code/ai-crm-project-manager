name: CWOS One Shot Contract Completion Routes

on:
  push:
    branches:
      - feat/customer-work-os-v1-full

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix(cwos): govern contract activation completion and closure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-work-os-v1-full
          fetch-depth: 0
      - name: Patch governed lifecycle routes
        run: |
          python - <<'PY'
          from pathlib import Path

          routes = Path('apps/api/src/customer-work-os-routes-durable.ts')
          text = routes.read_text()
          old_contract = '''  app.post("/api/cwos/contracts/from-quote", async (request, reply) => {
    await mutate(request, reply, "contract.from_quote", (service, workspaceId, _principalId, body) => {
      const quoteExpectedVersion = numberField(body, "quoteExpectedVersion");
      const contract = body.contract;
      if (!contract || typeof contract !== "object" || Array.isArray(contract)) throw new CustomerWorkOsError("INVALID_INPUT", "contract object is required");
      const contractBody = contract as Record<string, unknown>;
      stringField(contractBody, "id"); stringField(contractBody, "engagementId"); stringField(contractBody, "quoteId"); stringField(contractBody, "title"); stringField(contractBody, "scope"); stringField(contractBody, "contractValueKrw"); stringField(contractBody, "effectiveFrom"); arrayField(contractBody, "exclusions"); arrayField(contractBody, "billingMilestones");
      return service.acceptQuoteAsContract({ ...(contractBody as unknown as Omit<Contract, "workspaceId" | "version" | "status">), workspaceId }, quoteExpectedVersion);
    });
  });'''
          new_contract = '''  app.post("/api/cwos/contracts/from-quote", async (request, reply) => {
    try {
      const workspaceId = header(request, "x-workspace-id");
      const principalId = header(request, "x-principal-id");
      const idempotencyKey = header(request, "idempotency-key");
      const body = bodyObject(request);
      const quoteExpectedVersion = numberField(body, "quoteExpectedVersion");
      const engagementExpectedVersion = numberField(body, "engagementExpectedVersion");
      const contract = body.contract;
      if (!contract || typeof contract !== "object" || Array.isArray(contract)) throw new CustomerWorkOsError("INVALID_INPUT", "contract object is required");
      const contractBody = contract as Record<string, unknown>;
      stringField(contractBody, "id"); stringField(contractBody, "engagementId"); stringField(contractBody, "quoteId"); stringField(contractBody, "title"); stringField(contractBody, "scope"); stringField(contractBody, "contractValueKrw"); stringField(contractBody, "effectiveFrom"); arrayField(contractBody, "exclusions"); arrayField(contractBody, "billingMilestones");
      const engagementId = stringField(contractBody, "engagementId");
      const activationPayload = {
        quoteId: stringField(contractBody, "quoteId"),
        contractValueKrw: stringField(contractBody, "contractValueKrw"),
        scope: stringField(contractBody, "scope"),
        exclusions: arrayField(contractBody, "exclusions"),
        effectiveFrom: stringField(contractBody, "effectiveFrom"),
        effectiveTo: optionalString(contractBody, "effectiveTo") ?? null,
        billingMilestones: arrayField(contractBody, "billingMilestones"),
      };
      const receipt = await resolveApproval({ workspaceId, approvalId: approvalId(body), resourceType: "engagement", resourceId: engagementId, resourceVersion: engagementExpectedVersion, action: "CONTRACT_ACTIVATE", payloadHash: customerWorkOsPayloadHash(activationPayload) });
      const requestHash = customerWorkOsPayloadHash({ route: "contract.activate", workspaceId, principalId, body });
      const input = { ...(contractBody as unknown as Omit<Contract, "workspaceId" | "version" | "status">), workspaceId };
      const result = await manager.mutate({ workspaceId, principalId, idempotencyKey, requestHash, operationId: "contract.activate", operation: (service) => service.acceptQuoteAsContract(input, quoteExpectedVersion, receipt), now: now() });
      reply.header("x-idempotent-replay", result.replayed ? "true" : "false").code(result.statusCode).send(result.payload);
    } catch (error) { sendError(reply, error); }
  });'''
          if old_contract not in text:
              raise SystemExit('contract route block not found')
          text = text.replace(old_contract, new_contract)

          lifecycle_routes = '''
  app.post<{ Params: { projectId: string; deliverableId: string } }>("/api/cwos/delivery-projects/:projectId/deliverables/:deliverableId/status", async (request, reply) => {
    await mutate(request, reply, "delivery.deliverable.status", (service, workspaceId, _principalId, body) => service.updateDeliverableStatus(
      workspaceId,
      request.params.projectId,
      numberField(body, "expectedVersion"),
      request.params.deliverableId,
      stringField(body, "status") as Parameters<typeof service.updateDeliverableStatus>[4],
      optionalString(body, "evidenceRef"),
    ));
  });

  app.post<{ Params: { projectId: string; workItemId: string } }>("/api/cwos/delivery-projects/:projectId/work-items/:workItemId/status", async (request, reply) => {
    await mutate(request, reply, "delivery.work_item.status", (service, workspaceId, _principalId, body) => service.updateDeliveryWorkItemStatus(
      workspaceId,
      request.params.projectId,
      numberField(body, "expectedVersion"),
      request.params.workItemId,
      stringField(body, "status") as Parameters<typeof service.updateDeliveryWorkItemStatus>[4],
      body.actualHours === undefined ? undefined : numberField(body, "actualHours"),
    ));
  });

  app.post<{ Params: { projectId: string } }>("/api/cwos/delivery-projects/:projectId/completion/propose", async (request, reply) => {
    await mutate(request, reply, "delivery.completion.propose", (service, workspaceId, _principalId, body) => service.proposeDeliveryCompletion(workspaceId, request.params.projectId, numberField(body, "expectedVersion")));
  });

  app.post<{ Params: { projectId: string } }>("/api/cwos/delivery-projects/:projectId/completion/approve", async (request, reply) => {
    try {
      const workspaceId = header(request, "x-workspace-id"); const principalId = header(request, "x-principal-id"); const idempotencyKey = header(request, "idempotency-key"); const body = bodyObject(request);
      const engagementId = stringField(body, "engagementId"); const expectedVersion = numberField(body, "expectedVersion");
      const project = await manager.read(workspaceId, (service) => service.getEngagementSnapshot(workspaceId, engagementId).deliveryProjects.find((item) => item.id === request.params.projectId));
      if (!project) throw new CustomerWorkOsError("NOT_FOUND", `delivery project not found: ${request.params.projectId}`);
      const payload = { projectId: project.id, version: project.version, deliverables: project.deliverables, workItems: project.workItems };
      const receipt = await resolveApproval({ workspaceId, approvalId: approvalId(body), resourceType: "delivery_project", resourceId: project.id, resourceVersion: expectedVersion, action: "DELIVERY_COMPLETE", payloadHash: customerWorkOsPayloadHash(payload) });
      const requestHash = customerWorkOsPayloadHash({ route: "delivery.complete", workspaceId, principalId, body });
      const result = await manager.mutate({ workspaceId, principalId, idempotencyKey, requestHash, operationId: "delivery.complete", operation: (service) => service.completeDelivery(workspaceId, project.id, expectedVersion, receipt), now: now() });
      reply.header("x-idempotent-replay", result.replayed ? "true" : "false").code(result.statusCode).send(result.payload);
    } catch (error) { sendError(reply, error); }
  });

  app.post<{ Params: { engagementId: string } }>("/api/cwos/engagements/:engagementId/close", async (request, reply) => {
    try {
      const workspaceId = header(request, "x-workspace-id"); const principalId = header(request, "x-principal-id"); const idempotencyKey = header(request, "idempotency-key"); const body = bodyObject(request);
      const expectedVersion = numberField(body, "expectedVersion");
      const snapshot = await manager.read(workspaceId, (service) => service.getEngagementSnapshot(workspaceId, request.params.engagementId));
      const openCommitments = snapshot.commitments.filter((item) => !["DONE", "CANCELLED"].includes(item.status)).length;
      const payload = { stage: snapshot.engagement.stage, finance: snapshot.finance, openCommitments };
      const receipt = await resolveApproval({ workspaceId, approvalId: approvalId(body), resourceType: "engagement", resourceId: snapshot.engagement.id, resourceVersion: expectedVersion, action: "ENGAGEMENT_CLOSE", payloadHash: customerWorkOsPayloadHash(payload) });
      const requestHash = customerWorkOsPayloadHash({ route: "engagement.close", workspaceId, principalId, body });
      const result = await manager.mutate({ workspaceId, principalId, idempotencyKey, requestHash, operationId: "engagement.close", operation: (service) => service.closeEngagement(workspaceId, snapshot.engagement.id, expectedVersion, receipt), now: now() });
      reply.header("x-idempotent-replay", result.replayed ? "true" : "false").code(result.statusCode).send(result.payload);
    } catch (error) { sendError(reply, error); }
  });

'''
          marker = '  app.post("/api/cwos/change-requests", async (request, reply) => {'
          if '/completion/propose' not in text:
              if marker not in text:
                  raise SystemExit('change route anchor not found')
              text = text.replace(marker, lifecycle_routes + marker)
          routes.write_text(text)

          controls = Path('apps/api/src/customer-work-os-controls.ts')
          text = controls.read_text()
          in_memory_anchor = '''    const control = await this.get(input.workspaceId, input.approvalId);
    if (
      control.status !== "CONSUMED" ||'''
          in_memory_new = '''    const control = await this.get(input.workspaceId, input.approvalId);
    if (new Date(this.now()).getTime() >= new Date(control.expiresAt).getTime()) throw new CustomerWorkOsError("STALE_APPROVAL", "consumed approval has expired before execution");
    if (
      control.status !== "CONSUMED" ||'''
          if in_memory_anchor not in text:
              raise SystemExit('resolve anchor not found')
          text = text.replace(in_memory_anchor, in_memory_new, 1)
          # The second resolve implementation in Pg service uses the same text; patch it too.
          if in_memory_anchor not in text:
              raise SystemExit('PG resolve anchor not found')
          text = text.replace(in_memory_anchor, in_memory_new, 1)
          controls.write_text(text)

          Path('.github/workflows/cwos-one-shot-contract-completion-routes.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api .github/workflows/cwos-one-shot-contract-completion-routes.yml
          git commit -m "fix(cwos): govern contract activation completion and closure"
          git push origin HEAD:feat/customer-work-os-v1-full
