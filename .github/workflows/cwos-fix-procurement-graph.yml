name: CWOS Fix Procurement Graph Loop

on:
  push:
    branches:
      - feat/customer-work-os-v1-full

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-work-os-v1-full
          fetch-depth: 0
      - name: Apply graph repair
        run: python scripts/fix-procurement-graph-loop.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/domain/src/customer-work-os-graphs.ts scripts/fix-procurement-graph-loop.py .github/workflows/cwos-fix-procurement-graph.yml
          git commit -m "fix(cwos): bound procurement validation loop"
          git push origin HEAD:feat/customer-work-os-v1-full
