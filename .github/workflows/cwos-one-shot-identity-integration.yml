name: CWOS One Shot Identity Integration

on:
  push:
    branches:
      - feat/customer-work-os-v1-full

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix(cwos): validate every request principal and workspace') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-work-os-v1-full
          fetch-depth: 0
      - name: Integrate principal resolver
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/customer-work-os-routes-durable.ts')
          text = path.read_text()
          imports = '''import {
  createPgCustomerWorkOsIdentityResolverFromEnvironment,
  type CustomerWorkOsIdentity,
  type CustomerWorkOsIdentityResolver,
} from "./customer-work-os-identity.js";
'''
          anchor = 'import {\n  buildCustomerWorkOsControlRequestHash,'
          if imports not in text:
              text = text.replace(anchor, imports + anchor)
          text = text.replace(
              '  notionStore?: NotionPlanStore;\n  now?: () => string;',
              '  notionStore?: NotionPlanStore;\n  identityResolver?: CustomerWorkOsIdentityResolver;\n  now?: () => string;',
          )
          setup = '''  const notionStore = options.notionStore ?? await createPgNotionPlanStoreFromEnvironment() ?? new InMemoryNotionPlanStore();
  const now = options.now ?? (() => new Date().toISOString());
  const notionService = new CustomerWorkOsNotionService(notionStore, now);
  const manager = new CustomerWorkOsRuntimeManager(store);'''
          replacement = '''  const notionStore = options.notionStore ?? await createPgNotionPlanStoreFromEnvironment() ?? new InMemoryNotionPlanStore();
  const configuredIdentity = options.identityResolver ?? await createPgCustomerWorkOsIdentityResolverFromEnvironment();
  if (!configuredIdentity && process.env.NODE_ENV === "production") throw new CustomerWorkOsError("IDENTITY_INFRASTRUCTURE_REQUIRED", "production CWOS requires PostgreSQL principal resolution");
  const identityResolver: CustomerWorkOsIdentityResolver = configuredIdentity ?? {
    async resolve(workspaceId: string, principalId: string) {
      return { workspaceId, principalId, kind: "HUMAN", role: "owner", active: true };
    },
  };
  const now = options.now ?? (() => new Date().toISOString());
  const notionService = new CustomerWorkOsNotionService(notionStore, now);
  const manager = new CustomerWorkOsRuntimeManager(store);'''
          if setup not in text:
              raise SystemExit('notion setup anchor not found')
          text = text.replace(setup, replacement)
          close_anchor = '  if (notionStore !== options.notionStore) app.addHook("onClose", async () => notionStore.close?.());'
          text = text.replace(close_anchor, close_anchor + '\n  if (configuredIdentity && configuredIdentity !== options.identityResolver) app.addHook("onClose", async () => configuredIdentity.close?.());')
          hook = '''
  const requestIdentities = new WeakMap<FastifyRequest, CustomerWorkOsIdentity>();
  app.addHook("preHandler", async (request, reply) => {
    if (!request.url.startsWith("/api/cwos")) return;
    try {
      const workspaceId = header(request, "x-workspace-id");
      const principalId = header(request, "x-principal-id");
      const identity = await identityResolver.resolve(workspaceId, principalId);
      if (!identity.active || identity.workspaceId !== workspaceId || identity.principalId !== principalId) throw new CustomerWorkOsError("PRINCIPAL_BINDING_FAILED", "request identity does not match the workspace principal registry");
      requestIdentities.set(request, identity);
    } catch (error) {
      sendError(reply, error);
      return reply;
    }
  });

  function trustedIdentity(request: FastifyRequest): CustomerWorkOsIdentity {
    const identity = requestIdentities.get(request);
    if (!identity) throw new CustomerWorkOsError("UNAUTHENTICATED", "trusted Customer Work OS identity is missing");
    return identity;
  }

'''
          marker = '  async function mutate<T>('
          if 'const requestIdentities = new WeakMap' not in text:
              if marker not in text:
                  raise SystemExit('mutate helper anchor not found')
              text = text.replace(marker, hook + marker)
          # Ensure mutation helper uses the already validated identity rather than reinterpreting headers.
          text = text.replace(
              '      const workspaceId = header(request, "x-workspace-id");\n      const principalId = header(request, "x-principal-id");\n      const idempotencyKey = header(request, "idempotency-key");',
              '      const { workspaceId, principalId } = trustedIdentity(request);\n      const idempotencyKey = header(request, "idempotency-key");',
              1,
          )
          path.write_text(text)
          Path('.github/workflows/cwos-one-shot-identity-integration.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api .github/workflows/cwos-one-shot-identity-integration.yml
          git commit -m "fix(cwos): validate every request principal and workspace"
          git push origin HEAD:feat/customer-work-os-v1-full
