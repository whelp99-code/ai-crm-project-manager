name: Customer Work OS

on:
  push:
    branches:
      - "feat/customer-work-os-v1*"
      - "release/customer-work-os-v1-stabilization"
  pull_request:
    paths:
      - "packages/domain/**"
      - "apps/**"
      - "packages/**"
      - "docs/customer-work-os/**"
      - ".github/workflows/customer-work-os.yml"

concurrency:
  group: cwos-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "9.15.0"

jobs:
  domain-verification:
    name: Domain typecheck, integration and adversarial tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile 2>&1 | tee workspace-install-node-${{ matrix.node }}.log
      - name: Domain typecheck
        run: pnpm --filter @ai-crm/domain typecheck 2>&1 | tee domain-typecheck-node-${{ matrix.node }}.log
      - name: Domain tests
        run: pnpm --filter @ai-crm/domain test 2>&1 | tee domain-tests-node-${{ matrix.node }}.log
      - name: Workspace typecheck
        run: pnpm run typecheck 2>&1 | tee workspace-typecheck-node-${{ matrix.node }}.log
      - name: Workspace tests
        run: pnpm run test 2>&1 | tee workspace-tests-node-${{ matrix.node }}.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cwos-node-${{ matrix.node }}-diagnostics
          path: "*-node-${{ matrix.node }}.log"
          if-no-files-found: error
