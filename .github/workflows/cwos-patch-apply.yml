name: CWOS controlled patch applicator

on:
  push:
    branches:
      - release/customer-work-os-v1-stabilization
    paths:
      - ".github/cwos-patches/*.patch"

permissions:
  contents: write

concurrency:
  group: cwos-patch-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exactly one reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t patches < <(find .github/cwos-patches -maxdepth 1 -type f -name '*.patch' | sort)
          test "${#patches[@]}" -eq 1
          patch_file="${patches[0]}"
          git apply --check "$patch_file"
          git apply "$patch_file"
          rm -f "$patch_file"
          git config user.name "cwos-release-bot"
          git config user.email "cwos-release-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(cwos): close v1 release-gate findings"
          git push origin "HEAD:${GITHUB_REF_NAME}"
