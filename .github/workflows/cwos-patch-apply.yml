name: CWOS controlled patch applicator

on:
  push:
    branches:
      - release/customer-work-os-v1-stabilization
    paths:
      - ".github/cwos-patches/**"

permissions:
  contents: write

concurrency:
  group: cwos-patch-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ endsWith(github.event.head_commit.message, '[apply-cwos-patch]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and apply exactly one reviewed patch bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cwos-patch
          mapfile -t parts < <(find .github/cwos-patches -maxdepth 1 -type f -name '*.b64part' | sort)
          mapfile -t patches < <(find .github/cwos-patches -maxdepth 1 -type f -name '*.patch' | sort)
          if [ "${#parts[@]}" -gt 0 ]; then
            test "${#patches[@]}" -eq 0
            cat "${parts[@]}" > /tmp/cwos-patch/reviewed.patch.gz.b64
            echo "f31a3975dc7df3b42a2cbfab963c7c748d43111deaabf6fc8a74e22e5b8e5d5b  /tmp/cwos-patch/reviewed.patch.gz.b64" | sha256sum --check --strict
            base64 --decode /tmp/cwos-patch/reviewed.patch.gz.b64 > /tmp/cwos-patch/reviewed.patch.gz
            echo "09e3a9e90cb16742956bd799c09168a6f609ed83eb78c4a9ec89aa5ad63323ec  /tmp/cwos-patch/reviewed.patch.gz" | sha256sum --check --strict
            gzip --decompress --stdout /tmp/cwos-patch/reviewed.patch.gz > /tmp/cwos-patch/reviewed.patch
            echo "1af0036b5c56bb9e30e982d1252da66e34e0d2b6bd3d1f67ce95352d063be823  /tmp/cwos-patch/reviewed.patch" | sha256sum --check --strict
            patch_file=/tmp/cwos-patch/reviewed.patch
          else
            test "${#patches[@]}" -eq 1
            patch_file="${patches[0]}"
          fi
          git apply --check "$patch_file"
          git apply "$patch_file"
          rm -rf .github/cwos-patches/*
          git config user.name "cwos-release-bot"
          git config user.email "cwos-release-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(cwos): implement sequential Customer Work OS v2.0.0"
          git push origin "HEAD:${GITHUB_REF_NAME}"
