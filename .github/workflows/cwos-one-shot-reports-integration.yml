name: CWOS One Shot Reports Integration

on:
  push:
    branches:
      - feat/customer-work-os-v1-full

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'feat(cwos): integrate owner cockpit reporting') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-work-os-v1-full
          fetch-depth: 0
      - name: Export reports and add API
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          src = Path('packages/reports/src')
          src.mkdir(parents=True, exist_ok=True)
          index = src / 'index.ts'
          content = index.read_text() if index.exists() else ''
          line = 'export * from "./customer-work-os-reports.js";\n'
          if line not in content:
              content = content.rstrip() + ('\n\n' if content.strip() else '') + line
          index.write_text(content)

          package = Path('packages/reports/package.json')
          data = json.loads(package.read_text())
          data.setdefault('exports', {})['./customer-work-os-reports'] = './src/customer-work-os-reports.ts'
          data['exports'].setdefault('.', './src/index.ts')
          data.setdefault('dependencies', {})['@ai-crm/domain'] = 'workspace:*'
          package.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          routes = Path('apps/api/src/customer-work-os-routes-durable.ts')
          text = routes.read_text()
          import_line = 'import { buildOwnerCockpit } from "@ai-crm/reports/customer-work-os-reports";\n'
          if import_line not in text:
              anchor = 'import type { FastifyInstance, FastifyReply, FastifyRequest } from "fastify";\n'
              if anchor not in text:
                  raise SystemExit('Fastify import anchor not found')
              text = text.replace(anchor, anchor + import_line)
          route_block = '''
  app.get<{ Querystring: { asOf?: string } }>("/api/cwos/cockpit", async (request, reply) => {
    try {
      const workspaceId = header(request, "x-workspace-id");
      header(request, "x-principal-id");
      const asOf = request.query.asOf ?? now().slice(0, 10);
      return await manager.read(workspaceId, (service) => buildOwnerCockpit(service.exportState(), asOf));
    } catch (error) { sendError(reply, error); return undefined; }
  });

'''
          marker = '  app.get<{ Params: { engagementId: string } }>("/api/cwos/engagements/:engagementId", async (request, reply) => {'
          if '"/api/cwos/cockpit"' not in text:
              if marker not in text:
                  raise SystemExit('engagement GET anchor not found')
              text = text.replace(marker, route_block + marker)
          routes.write_text(text)

          api_package = Path('apps/api/package.json')
          api_data = json.loads(api_package.read_text())
          api_data.setdefault('dependencies', {})['@ai-crm/reports'] = 'workspace:*'
          api_package.write_text(json.dumps(api_data, ensure_ascii=False, indent=2) + '\n')

          Path('.github/workflows/cwos-one-shot-reports-integration.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/reports apps/api pnpm-lock.yaml .github/workflows/cwos-one-shot-reports-integration.yml
          git commit -m "feat(cwos): integrate owner cockpit reporting"
          git push origin HEAD:feat/customer-work-os-v1-full
