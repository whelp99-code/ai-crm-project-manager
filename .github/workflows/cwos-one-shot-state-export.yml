name: CWOS One Shot State Export

on:
  push:
    branches:
      - feat/customer-work-os-v1-full

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'feat(cwos): add durable domain state snapshot') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-work-os-v1-full
          fetch-depth: 0
      - name: Add state contract and hydrate/export methods
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/domain/src/customer-work-os.ts')
          text = path.read_text()
          state_interface = '''
export interface CustomerWorkOsState {
  schemaVersion: 1;
  accounts: Account[];
  contacts: Contact[];
  engagements: Engagement[];
  parties: EngagementParty[];
  activities: Activity[];
  knowledge: KnowledgeItem[];
  commitments: Commitment[];
  products: Product[];
  quotes: Quote[];
  contracts: Contract[];
  deliveryProjects: DeliveryProject[];
  changes: ChangeRequest[];
  purchaseOrders: PurchaseOrder[];
  assets: Asset[];
  financialItems: FinancialItem[];
  settlements: Settlement[];
  consumedReceiptIds: string[];
}
'''
          anchor = 'function copy<T>(value: T): T {'
          if 'export interface CustomerWorkOsState' not in text:
              if anchor not in text:
                  raise SystemExit('copy anchor not found')
              text = text.replace(anchor, state_interface + '\n' + anchor)
          methods = '''  exportState(): CustomerWorkOsState {
    return {
      schemaVersion: 1,
      accounts: [...this.accounts.values()].map(copy),
      contacts: [...this.contacts.values()].map(copy),
      engagements: [...this.engagements.values()].map(copy),
      parties: [...this.parties.values()].map(copy),
      activities: [...this.activities.values()].map(copy),
      knowledge: [...this.knowledge.values()].map(copy),
      commitments: [...this.commitments.values()].map(copy),
      products: [...this.products.values()].map(copy),
      quotes: [...this.quotes.values()].map(copy),
      contracts: [...this.contracts.values()].map(copy),
      deliveryProjects: [...this.deliveryProjects.values()].map(copy),
      changes: [...this.changes.values()].map(copy),
      purchaseOrders: [...this.purchaseOrders.values()].map(copy),
      assets: [...this.assets.values()].map(copy),
      financialItems: [...this.financialItems.values()].map(copy),
      settlements: [...this.settlements.values()].map(copy),
      consumedReceiptIds: [...this.consumedReceiptIds].sort(),
    };
  }

  hydrateState(state: CustomerWorkOsState): void {
    if (state.schemaVersion !== 1) throw new CustomerWorkOsError("UNSUPPORTED_STATE", `unsupported state schema: ${String(state.schemaVersion)}`);
    const load = <T>(target: Map<string, T>, rows: readonly T[], label: string): void => {
      target.clear();
      for (const row of rows as Array<T & { id: string }>) {
        if (!row.id?.trim()) throw new CustomerWorkOsError("INVALID_STATE", `${label} row has no id`);
        if (target.has(row.id)) throw new CustomerWorkOsError("DUPLICATE_ID", `duplicate ${label} in state: ${row.id}`);
        target.set(row.id, copy(row));
      }
    };
    load(this.accounts, state.accounts, "account");
    load(this.contacts, state.contacts, "contact");
    load(this.engagements, state.engagements, "engagement");
    load(this.parties, state.parties, "party");
    load(this.activities, state.activities, "activity");
    load(this.knowledge, state.knowledge, "knowledge");
    load(this.commitments, state.commitments, "commitment");
    load(this.products, state.products, "product");
    load(this.quotes, state.quotes, "quote");
    load(this.contracts, state.contracts, "contract");
    load(this.deliveryProjects, state.deliveryProjects, "delivery project");
    load(this.changes, state.changes, "change request");
    load(this.purchaseOrders, state.purchaseOrders, "purchase order");
    load(this.assets, state.assets, "asset");
    load(this.financialItems, state.financialItems, "financial item");
    load(this.settlements, state.settlements, "settlement");
    this.consumedReceiptIds.clear();
    for (const receiptId of state.consumedReceiptIds) {
      if (!receiptId.trim()) throw new CustomerWorkOsError("INVALID_STATE", "consumed receipt id is empty");
      this.consumedReceiptIds.add(receiptId);
    }
  }

'''
          marker = '  private openCommitments(workspaceId: string, engagementId: string): Commitment[] {'
          if '  exportState(): CustomerWorkOsState {' not in text:
              if marker not in text:
                  raise SystemExit('private method anchor not found')
              text = text.replace(marker, methods + marker)
          path.write_text(text)
          Path('.github/workflows/cwos-one-shot-state-export.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/domain/src/customer-work-os.ts .github/workflows/cwos-one-shot-state-export.yml
          git commit -m "feat(cwos): add durable domain state snapshot"
          git push origin HEAD:feat/customer-work-os-v1-full
