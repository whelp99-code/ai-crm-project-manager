name: Customer Work OS Release Gate

on:
  push:
    branches:
      - release/customer-work-os-v1-stabilization
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/cwos-*"
      - "docs/customer-work-os/**"
      - "deploy/**"
      - ".github/workflows/customer-work-os-release-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cwos-release-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "9.15.0"
  NEXT_PUBLIC_API_BASE_URL: ""

jobs:
  node-regression:
    name: Node ${{ matrix.node }} full regression
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      # Deployment scripts require Node 22. Record that binary, then restore the matrix runner on PATH.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record Node 22 deployment test runtime
        run: echo "CRM_DEPLOY_TEST_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile
      - name: Typecheck and all Vitest suites
        run: pnpm check
      - name: Package builds
        run: pnpm -r --if-present run build
      - name: Package lint
        run: pnpm -r --if-present run lint
      - name: Security suites
        run: pnpm -r --if-present run test:security
      - name: Integration suites
        run: pnpm -r --if-present run test:integration

  postgres-adversarial:
    name: PostgreSQL 16 migration, RLS, finance and restore
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PG_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_crm
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Apply every migration in lexical order
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: ai_crm
        run: ./packages/persistence/scripts/pg-rls-smoke.sh
      - name: Live PostgreSQL adversarial checks
        run: psql "$PG_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/cwos-pg-adversarial.sql
      - name: Persistence tests
        run: pnpm --filter @ai-crm/persistence test
      - name: API memory-mode regression
        # The job has a live database, but ordinary API tests intentionally stay in
        # memory mode. Only the explicit live-pg files below receive DATABASE_URL.
        env:
          DATABASE_URL: ""
          AI_CRM_DATABASE_URL: ""
          AI_CRM_TEST_DATABASE_URL: ""
          PERSISTENCE_MODE: memory
        run: pnpm --filter @ai-crm/api test
      - name: API live PostgreSQL tests
        env:
          DATABASE_URL: ${{ env.PG_TEST_DATABASE_URL }}
          AI_CRM_DATABASE_URL: ${{ env.PG_TEST_DATABASE_URL }}
          AI_CRM_TEST_DATABASE_URL: ${{ env.PG_TEST_DATABASE_URL }}
          LIVE_PG_TEST: "1"
        run: |
          pnpm --filter @ai-crm/api exec vitest run \
            test/n08-pg-primary.livepg.integration.test.ts \
            test/n09-notify.livepg.integration.test.ts \
            test/n12-n13-livepg.integration.test.ts \
            test/sor-restart-livepg.integration.test.ts \
            test/pg-a-crm-sub.livepg.integration.test.ts \
            test/pg-b-pm-delivery.livepg.integration.test.ts \
            test/pg-c1-ledger.livepg.integration.test.ts \
            test/pg-c2-recon-dailygate.livepg.integration.test.ts \
            test/q1-recon-pgfirst.livepg.integration.test.ts \
            test/pg-d-audit-primary.livepg.integration.test.ts \
            test/pg-mutex-concurrency.livepg.integration.test.ts \
            test/q2-reports-model.livepg.integration.test.ts \
            test/customer-work-os-v2.livepg.integration.test.ts \
            --no-file-parallelism
      - name: Backup and restore
        shell: bash
        run: |
          set -euo pipefail
          pg_dump --format=custom --no-owner --no-acl "$PG_TEST_DATABASE_URL" --file=/tmp/cwos.dump
          createdb -h 127.0.0.1 -U postgres ai_crm_restore
          pg_restore -h 127.0.0.1 -U postgres -d ai_crm_restore --no-owner --no-acl /tmp/cwos.dump
          original=$(psql "$PG_TEST_DATABASE_URL" -Atc "select count(*) from information_schema.tables where table_schema='public'")
          restored=$(psql "postgresql://postgres:postgres@127.0.0.1:5432/ai_crm_restore" -Atc "select count(*) from information_schema.tables where table_schema='public'")
          test "$original" = "$restored"

  web-e2e:
    name: Web production build and E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Production builds
        run: pnpm -r --if-present run build
      - name: Install Playwright Chromium from the web workspace
        run: pnpm --filter @ai-crm/web exec playwright install --with-deps chromium
      - name: Repository E2E suites
        run: pnpm -r --if-present run test:e2e

  dependency-security:
    name: Dependency and capability security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: High-severity dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Reject raw provider and process capabilities in CWOS domain
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'child_process|node:fs|from "(openai|@anthropic-ai|@google/generative-ai)"|fetch\(' \
            packages/domain/src/customer-work-os.ts \
            packages/domain/src/customer-work-os-v2 \
            packages/ai-orchestrator/src/customer-work-os-ai.ts; then
            echo "forbidden capability found"
            exit 1
          fi
          echo "capability boundary clean"

  release-gate:
    name: Enforce zero open gate failures
    if: always()
    needs:
      - node-regression
      - postgres-adversarial
      - web-e2e
      - dependency-security
    runs-on: ubuntu-latest
    steps:
      - name: Verify every declared Customer Work OS gate passed
        env:
          NODE_RESULT: ${{ needs.node-regression.result }}
          PG_RESULT: ${{ needs.postgres-adversarial.result }}
          WEB_RESULT: ${{ needs.web-e2e.result }}
          SECURITY_RESULT: ${{ needs.dependency-security.result }}
        run: |
          echo "node=$NODE_RESULT postgres=$PG_RESULT web=$WEB_RESULT security=$SECURITY_RESULT"
          test "$NODE_RESULT" = success
          test "$PG_RESULT" = success
          test "$WEB_RESULT" = success
          test "$SECURITY_RESULT" = success
