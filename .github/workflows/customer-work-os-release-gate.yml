name: Customer Work OS Release Gate

on:
  push:
    branches:
      - release/customer-work-os-v1-stabilization
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/cwos-*"
      - "docs/customer-work-os/**"
      - ".github/workflows/customer-work-os-release-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cwos-release-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "9.15.0"
  NEXT_PUBLIC_API_BASE_URL: ""

jobs:
  node-regression:
    name: Node ${{ matrix.node }} full regression
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile
      - name: Typecheck and all Vitest suites
        run: pnpm check
      - name: Package builds
        run: pnpm -r --if-present run build
      - name: Package lint
        run: pnpm -r --if-present run lint
      - name: Security suites
        run: pnpm -r --if-present run test:security
      - name: Integration suites
        run: pnpm -r --if-present run test:integration

  postgres-adversarial:
    name: PostgreSQL 16 migration, RLS, finance and restore
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_crm
      AI_CRM_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_crm
      AI_CRM_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_crm
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Apply every migration in lexical order
        shell: bash
        run: |
          set -euo pipefail
          for migration in $(find packages/persistence/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "=== $migration ==="
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Live PostgreSQL adversarial checks
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/cwos-pg-adversarial.sql
      - name: Persistence tests
        run: pnpm --filter @ai-crm/persistence test
      - name: API tests against PostgreSQL
        run: pnpm --filter @ai-crm/api test
      - name: Backup and restore
        shell: bash
        run: |
          set -euo pipefail
          pg_dump --format=custom --no-owner --no-acl "$DATABASE_URL" --file=/tmp/cwos.dump
          createdb -h 127.0.0.1 -U postgres ai_crm_restore
          pg_restore -h 127.0.0.1 -U postgres -d ai_crm_restore --no-owner --no-acl /tmp/cwos.dump
          original=$(psql "$DATABASE_URL" -Atc "select count(*) from information_schema.tables where table_schema='public'")
          restored=$(psql "postgresql://postgres:postgres@127.0.0.1:5432/ai_crm_restore" -Atc "select count(*) from information_schema.tables where table_schema='public'")
          test "$original" = "$restored"

  web-e2e:
    name: Web production build and E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Production builds
        run: pnpm -r --if-present run build
      - name: Install Chromium when Playwright is available
        shell: bash
        run: |
          if pnpm exec playwright --version >/dev/null 2>&1; then
            pnpm exec playwright install --with-deps chromium
          else
            echo "Playwright binary not present; repository E2E script determines coverage"
          fi
      - name: Repository E2E suites
        run: pnpm -r --if-present run test:e2e

  dependency-security:
    name: Dependency and capability security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: High-severity dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Reject raw provider and process capabilities in CWOS domain
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'child_process|node:fs|from "(openai|@anthropic-ai|@google/generative-ai)"|fetch\(' packages/domain/src/customer-work-os.ts packages/ai-orchestrator/src/customer-work-os-ai.ts; then
            echo "forbidden capability found"
            exit 1
          fi
          echo "capability boundary clean"

  release-gate:
    name: Enforce zero open gate failures
    if: always()
    needs:
      - node-regression
      - postgres-adversarial
      - web-e2e
      - dependency-security
    runs-on: ubuntu-latest
    steps:
      - name: Verify every declared v1.0.0 gate passed
        env:
          NODE_RESULT: ${{ needs.node-regression.result }}
          PG_RESULT: ${{ needs.postgres-adversarial.result }}
          WEB_RESULT: ${{ needs.web-e2e.result }}
          SECURITY_RESULT: ${{ needs.dependency-security.result }}
        run: |
          echo "node=$NODE_RESULT postgres=$PG_RESULT web=$WEB_RESULT security=$SECURITY_RESULT"
          test "$NODE_RESULT" = success
          test "$PG_RESULT" = success
          test "$WEB_RESULT" = success
          test "$SECURITY_RESULT" = success
