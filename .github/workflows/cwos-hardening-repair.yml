name: CWOS One Shot Domain Hardening Repair

on:
  push:
    branches:
      - feat/customer-work-os-v1-full

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-work-os-v1-full
          fetch-depth: 0
      - name: Apply deterministic hardening repair
        run: python scripts/cwos-hardening-repair.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/domain/src/customer-work-os.ts packages/domain/src/workflow-graph.ts packages/domain/test/workflow-graph.unit.test.ts scripts/cwos-hardening-repair.py .github/workflows/cwos-hardening-repair.yml
          git commit -m "fix(cwos): enforce delivery close asset and settlement invariants"
          git push origin HEAD:feat/customer-work-os-v1-full
