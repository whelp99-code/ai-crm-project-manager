name: CWOS One Shot Import Marker

on:
  push:
    branches:
      - feat/customer-work-os-v1-full

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'feat(cwos): add idempotent import application marker') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-work-os-v1-full
          fetch-depth: 0
      - name: Patch domain state marker
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/domain/src/customer-work-os.ts')
          text = path.read_text()
          text = text.replace(
              '  consumedReceiptIds: string[];\n}',
              '  consumedReceiptIds: string[];\n  appliedImportPlanHashes?: string[] | undefined;\n}',
          )
          text = text.replace(
              '  private readonly consumedReceiptIds = new Set<string>();',
              '  private readonly consumedReceiptIds = new Set<string>();\n  private readonly appliedImportPlanHashes = new Set<string>();',
          )
          text = text.replace(
              '      consumedReceiptIds: [...this.consumedReceiptIds].sort(),\n    };',
              '      consumedReceiptIds: [...this.consumedReceiptIds].sort(),\n      appliedImportPlanHashes: [...this.appliedImportPlanHashes].sort(),\n    };',
          )
          hydrate_anchor = '''    for (const receiptId of state.consumedReceiptIds) {
      if (!receiptId.trim()) throw new CustomerWorkOsError("INVALID_STATE", "consumed receipt id is empty");
      this.consumedReceiptIds.add(receiptId);
    }
  }
'''
          hydrate_new = '''    for (const receiptId of state.consumedReceiptIds) {
      if (!receiptId.trim()) throw new CustomerWorkOsError("INVALID_STATE", "consumed receipt id is empty");
      this.consumedReceiptIds.add(receiptId);
    }
    this.appliedImportPlanHashes.clear();
    for (const planHash of state.appliedImportPlanHashes ?? []) {
      if (!planHash.trim()) throw new CustomerWorkOsError("INVALID_STATE", "applied import plan hash is empty");
      this.appliedImportPlanHashes.add(planHash);
    }
  }
'''
          if hydrate_anchor not in text:
              raise SystemExit('hydrate receipt anchor not found')
          text = text.replace(hydrate_anchor, hydrate_new)
          methods = '''  isImportPlanApplied(planHash: string): boolean {
    return this.appliedImportPlanHashes.has(required(planHash, "planHash"));
  }

  markImportPlanApplied(
    workspaceId: string,
    planId: string,
    planVersion: number,
    planHash: string,
    receipt: ApprovalReceipt,
  ): void {
    const normalizedHash = required(planHash, "planHash");
    const payload = { planId: required(planId, "planId"), planVersion, planHash: normalizedHash };
    this.consume(receipt, workspaceId, "import_plan", planId, planVersion, "NOTION_IMPORT_APPLY", customerWorkOsPayloadHash(payload));
    this.appliedImportPlanHashes.add(normalizedHash);
  }

'''
          marker = '  exportState(): CustomerWorkOsState {'
          if '  markImportPlanApplied(' not in text:
              if marker not in text:
                  raise SystemExit('export state anchor not found')
              text = text.replace(marker, methods + marker)
          text = text.replace(
              '    | "delivery_project"\n    | "engagement";',
              '    | "delivery_project"\n    | "engagement"\n    | "import_plan";',
          )
          path.write_text(text)
          Path('.github/workflows/cwos-one-shot-import-marker.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/domain .github/workflows/cwos-one-shot-import-marker.yml
          git commit -m "feat(cwos): add idempotent import application marker"
          git push origin HEAD:feat/customer-work-os-v1-full
