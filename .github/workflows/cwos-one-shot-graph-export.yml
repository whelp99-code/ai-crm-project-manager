name: CWOS One Shot Graph Export

on:
  push:
    branches:
      - feat/customer-work-os-v1-full

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'feat(cwos): export bounded business workflow graphs') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-work-os-v1-full
          fetch-depth: 0
      - name: Export graph registry
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/domain/src/index.ts')
          text = path.read_text()
          line = 'export * from "./customer-work-os-graphs.js";\n'
          if line not in text:
              text = text.rstrip() + '\n' + line
          path.write_text(text)
          package = Path('packages/domain/package.json')
          p = package.read_text()
          if '"./customer-work-os-graphs"' not in p:
              p = p.replace('"./customer-work-os": "./src/customer-work-os.ts",', '"./customer-work-os": "./src/customer-work-os.ts",\n    "./customer-work-os-graphs": "./src/customer-work-os-graphs.ts",')
          package.write_text(p)
          Path('.github/workflows/cwos-one-shot-graph-export.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/domain .github/workflows/cwos-one-shot-graph-export.yml
          git commit -m "feat(cwos): export bounded business workflow graphs"
          git push origin HEAD:feat/customer-work-os-v1-full
