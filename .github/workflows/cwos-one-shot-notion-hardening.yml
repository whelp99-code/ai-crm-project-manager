name: CWOS One Shot Notion Hardening

on:
  push:
    branches:
      - feat/customer-work-os-v1-full

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix(cwos): harden Notion partial settlement and party mapping') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-work-os-v1-full
          fetch-depth: 0
      - name: Patch mapper and apply logic
        run: |
          python - <<'PY'
          from pathlib import Path

          planner = Path('packages/imports/src/notion-cwos.ts')
          text = planner.read_text()
          text = text.replace(
              '  actualDate?: string | undefined;\n  evidenceRefs: string[];',
              '  actualDate?: string | undefined;\n  actualAmountKrw?: string | undefined;\n  evidenceRefs: string[];',
          )
          old_account = '''        const accountSourceId = accountRelations[0] ?? null;
        if (accountSourceId && !accountSourceIds.has(accountSourceId)) {'''
          new_account = '''        const accountSourceId = accountRelations[0] ?? null;
        if (!accountSourceId) {
          orphanRelations += 1;
          quarantine("financial_item", row, ["ORPHAN_FINANCE"], "financial item has no customer, vendor or counterparty relation");
          continue;
        }
        if (!accountSourceIds.has(accountSourceId)) {'''
          if old_account not in text:
              raise SystemExit('account relation anchor not found')
          text = text.replace(old_account, new_account)
          actual_anchor = '''        const expectedDate = direction === "IN"
          ? dateValue(row.properties, ["date:예상 입금일:start", "예상 입금일"])
          : dateValue(row.properties, ["date:예상 출금일:start", "예상 출금일"]);
        const actualDate = dateValue(row.properties, ["date:실제 처리일:start", "실제 처리일"]);'''
          actual_new = actual_anchor + '''
        const actualAmount = integerMoney(row.properties, ["실제금액", "입금액", "지급액", "처리금액"]);
        const lifecycle = financialLifecycle(kind, booleanValue(row.properties, ["입금처리여부"]), booleanValue(row.properties, ["출금처리여부"]), text(row.properties, ["상태"]));
        if (lifecycle === "PARTIAL" && (actualAmount === undefined || actualAmount <= 0n || actualAmount >= gross)) {
          quarantine("financial_item", row, ["INVALID_AMOUNT"], "partial transaction requires an actual amount greater than zero and below gross amount");
          continue;
        }'''
          if actual_anchor not in text:
              raise SystemExit('actual date anchor not found')
          text = text.replace(actual_anchor, actual_new)
          text = text.replace(
              '          lifecycle: financialLifecycle(kind, booleanValue(row.properties, ["입금처리여부"]), booleanValue(row.properties, ["출금처리여부"]), text(row.properties, ["상태"])),',
              '          lifecycle,',
          )
          text = text.replace(
              '          ...(actualDate ? { actualDate } : {}),\n          evidenceRefs:',
              '          ...(actualDate ? { actualDate } : {}),\n          ...(actualAmount !== undefined ? { actualAmountKrw: actualAmount.toString() } : {}),\n          evidenceRefs:',
          )
          planner.write_text(text)

          apply = Path('apps/api/src/customer-work-os-notion.ts')
          text = apply.read_text()
          text = text.replace('        roles: ["business"],\n        relationship: "unknown",\n        version: 1,', '        roles: ["business"],\n        relationship: "unknown",')
          old_customers = '''    for (const source of item.accountSourceIds) {
      const accountId = accountIds.get(source)!;
      service.assignParty({ id: `party-${notionCwosHash({ engagement: item.id, accountId, role: "customer" }).slice(-8)}`, workspaceId: item.workspaceId, engagementId: item.id, accountId, role: "customer", primary: true });
      parties += 1;
    }'''
          new_customers = '''    item.accountSourceIds.forEach((source, index) => {
      const accountId = accountIds.get(source)!;
      service.assignParty({ id: `party-${notionCwosHash({ engagement: item.id, accountId, role: "customer" }).slice(-8)}`, workspaceId: item.workspaceId, engagementId: item.id, accountId, role: "customer", primary: index === 0 });
      parties += 1;
    });'''
          if old_customers not in text:
              raise SystemExit('customer party loop not found')
          text = text.replace(old_customers, new_customers)
          text = text.replace(
              '    if (item.lifecycle === "SETTLED") {\n      service.recordSettlement({ id: `settlement-${notionCwosHash(item.id).slice(-8)}`, workspaceId: item.workspaceId, financialItemId: item.id, direction: item.direction, amountKrw: item.grossAmountKrw,',
              '    if (item.lifecycle === "SETTLED" || item.lifecycle === "PARTIAL") {\n      service.recordSettlement({ id: `settlement-${notionCwosHash(item.id).slice(-8)}`, workspaceId: item.workspaceId, financialItemId: item.id, direction: item.direction, amountKrw: item.lifecycle === "PARTIAL" ? item.actualAmountKrw! : item.grossAmountKrw,',
          )
          apply.write_text(text)

          Path('.github/workflows/cwos-one-shot-notion-hardening.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/imports apps/api .github/workflows/cwos-one-shot-notion-hardening.yml
          git commit -m "fix(cwos): harden Notion partial settlement and party mapping"
          git push origin HEAD:feat/customer-work-os-v1-full
