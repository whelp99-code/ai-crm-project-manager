name: CWOS One Shot Controls Integration

on:
  push:
    branches:
      - feat/customer-work-os-v1-full

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix(cwos): integrate governed control lifecycle') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-work-os-v1-full
          fetch-depth: 0
      - name: Patch control lifecycle and durable routes
        run: |
          python - <<'PY'
          from pathlib import Path

          controls = Path('apps/api/src/customer-work-os-controls.ts')
          text = controls.read_text()
          text = text.replace(
              'import { CustomerWorkOsError, type ApprovalReceipt } from "@ai-crm/domain/customer-work-os";',
              'import { CustomerWorkOsError, customerWorkOsPayloadHash, type ApprovalReceipt } from "@ai-crm/domain/customer-work-os";',
          )
          text = text.replace('  return JSON.stringify({', '  return customerWorkOsPayloadHash({')
          explicit_hash = '''const expectedHash = controlRequestHash({
      workspaceId: input.workspaceId,
      requesterPrincipalId: input.requesterPrincipalId,
      idempotencyKey: input.idempotencyKey,
      action: input.action,
      resourceType: input.resourceType,
      resourceId: input.resourceId,
      resourceVersion: input.resourceVersion,
      payloadHash: input.payloadHash,
      reason: input.reason,
    });'''
          text = text.replace('const expectedHash = controlRequestHash({ ...input, requestHash: undefined as never });', explicit_hash)
          text = text.replace(
              '    const policy = customerWorkOsControlPolicy(input.action);',
              '    if (!Number.isInteger(input.resourceVersion) || input.resourceVersion < 1) throw new CustomerWorkOsError("INVALID_RESOURCE_VERSION", "resourceVersion must be an integer >= 1");\n    const policy = customerWorkOsControlPolicy(input.action);',
          )
          old_expired = '''      if (evaluation.code === "APPROVAL_EXPIRED") {
        control.status = "EXPIRED";
        control.updatedAt = decisionAt;
      }
      throw new CustomerWorkOsError(evaluation.code, evaluation.reason);'''
          new_expired = '''      if (evaluation.code === "APPROVAL_EXPIRED") {
        control.status = "EXPIRED";
        control.updatedAt = decisionAt;
        control.decidedByPrincipalId = approver.id;
        control.decisionReason = evaluation.reason;
        this.decisionKeys.set(key, control.id);
        return copy(control);
      }
      throw new CustomerWorkOsError(evaluation.code, evaluation.reason);'''
          if old_expired not in text:
              raise SystemExit('in-memory expiry block not found')
          text = text.replace(old_expired, new_expired)
          old_pg_expired = '''        if (evaluation.code === "APPROVAL_EXPIRED") {
          await connection.query(
            `UPDATE orch_governance_controls SET status = 'EXPIRED', updated_at = $3::timestamptz
              WHERE workspace_id = $1 AND id = $2 AND status = 'REQUESTED'`,
            [input.workspaceId, input.controlId, decisionAt],
          );
          await connection.query(
            `INSERT INTO cwos_control_decision_events
              (workspace_id, control_id, event_type, actor_principal_id, reason,
               idempotency_key, payload_hash, occurred_at)
             VALUES ($1, $2, 'EXPIRED', $3, $4, $5, $6, $7::timestamptz)`,
            [input.workspaceId, input.controlId, approver.id, evaluation.reason,
             input.idempotencyKey, control.payloadHash, decisionAt],
          );
        }
        throw new CustomerWorkOsError(evaluation.code, evaluation.reason);'''
          new_pg_expired = '''        if (evaluation.code === "APPROVAL_EXPIRED") {
          const expired = await connection.query<ControlRow>(
            `UPDATE orch_governance_controls
                SET status = 'EXPIRED', decided_by_principal_id = $3,
                    decision_reason = $4, updated_at = $5::timestamptz
              WHERE workspace_id = $1 AND id = $2 AND status = 'REQUESTED'
              RETURNING ${CONTROL_COLUMNS}`,
            [input.workspaceId, input.controlId, approver.id, evaluation.reason, decisionAt],
          );
          const expiredRow = expired.rows[0];
          if (!expiredRow) throw new CustomerWorkOsError("CONCURRENT_MODIFICATION", "control was decided concurrently");
          await connection.query(
            `INSERT INTO cwos_control_decision_events
              (workspace_id, control_id, event_type, actor_principal_id, reason,
               idempotency_key, payload_hash, occurred_at)
             VALUES ($1, $2, 'EXPIRED', $3, $4, $5, $6, $7::timestamptz)`,
            [input.workspaceId, input.controlId, approver.id, evaluation.reason,
             input.idempotencyKey, control.payloadHash, decisionAt],
          );
          return rowToControl(expiredRow);
        }
        throw new CustomerWorkOsError(evaluation.code, evaluation.reason);'''
          if old_pg_expired not in text:
              raise SystemExit('PG expiry block not found')
          text = text.replace(old_pg_expired, new_pg_expired)
          controls.write_text(text)

          routes = Path('apps/api/src/customer-work-os-routes-durable.ts')
          text = routes.read_text()
          import_line = '''import {
  buildCustomerWorkOsControlRequestHash,
  createPgCustomerWorkOsControlServiceFromEnvironment,
  type CustomerWorkOsControlService,
} from "./customer-work-os-controls.js";
'''
          anchor = 'import {\n  CustomerWorkOsRuntimeManager,'
          if import_line not in text:
              text = text.replace(anchor, import_line + anchor)
          text = text.replace(
              '  approvals?: GovernanceApprovalResolver;\n  now?: () => string;',
              '  approvals?: GovernanceApprovalResolver;\n  controls?: CustomerWorkOsControlService;\n  now?: () => string;',
          )
          old_setup = '''  const store = options.store ?? infrastructure?.store ?? new InMemoryCustomerWorkOsSnapshotStore();
  const approvals = options.approvals ?? infrastructure?.approvals;
  const manager = new CustomerWorkOsRuntimeManager(store);'''
          new_setup = '''  const store = options.store ?? infrastructure?.store ?? new InMemoryCustomerWorkOsSnapshotStore();
  const controlService = options.controls ?? await createPgCustomerWorkOsControlServiceFromEnvironment();
  const approvals = options.approvals ?? controlService ?? infrastructure?.approvals;
  const manager = new CustomerWorkOsRuntimeManager(store);'''
          if old_setup not in text:
              raise SystemExit('route infrastructure setup not found')
          text = text.replace(old_setup, new_setup)
          text = text.replace(
              '  if (infrastructure) app.addHook("onClose", async () => infrastructure.close());\n  else if (store.close) app.addHook("onClose", async () => store.close?.());',
              '  if (infrastructure) app.addHook("onClose", async () => infrastructure.close());\n  else if (store.close) app.addHook("onClose", async () => store.close?.());\n  if (controlService && controlService !== options.controls) app.addHook("onClose", async () => controlService.close?.());',
          )
          governance_routes = '''
  app.post("/api/cwos/governance/requests", async (request, reply) => {
    try {
      if (!controlService) throw new CustomerWorkOsError("APPROVAL_INFRASTRUCTURE_REQUIRED", "control service is unavailable");
      const workspaceId = header(request, "x-workspace-id");
      const requesterPrincipalId = header(request, "x-principal-id");
      const idempotencyKey = header(request, "idempotency-key");
      const body = bodyObject(request);
      const fields = {
        workspaceId,
        requesterPrincipalId,
        idempotencyKey,
        action: stringField(body, "action") as Parameters<CustomerWorkOsControlService["request"]>[0]["action"],
        resourceType: stringField(body, "resourceType") as ApprovalReceipt["resourceType"],
        resourceId: stringField(body, "resourceId"),
        resourceVersion: numberField(body, "resourceVersion"),
        payloadHash: stringField(body, "payloadHash"),
        reason: stringField(body, "reason"),
      };
      const control = await controlService.request({ ...fields, requestHash: buildCustomerWorkOsControlRequestHash(fields) });
      reply.code(201).send(control);
    } catch (error) { sendError(reply, error); }
  });

  app.post<{ Params: { controlId: string } }>("/api/cwos/governance/requests/:controlId/decision", async (request, reply) => {
    try {
      if (!controlService) throw new CustomerWorkOsError("APPROVAL_INFRASTRUCTURE_REQUIRED", "control service is unavailable");
      const workspaceId = header(request, "x-workspace-id");
      const approverPrincipalId = header(request, "x-principal-id");
      const idempotencyKey = header(request, "idempotency-key");
      const body = bodyObject(request);
      const control = await controlService.decide({
        workspaceId,
        controlId: request.params.controlId,
        approverPrincipalId,
        idempotencyKey,
        decision: stringField(body, "decision") as "APPROVE" | "REJECT",
        reason: stringField(body, "reason"),
      });
      reply.code(200).send(control);
    } catch (error) { sendError(reply, error); }
  });

  app.get<{ Params: { controlId: string } }>("/api/cwos/governance/requests/:controlId", async (request, reply) => {
    try {
      if (!controlService) throw new CustomerWorkOsError("APPROVAL_INFRASTRUCTURE_REQUIRED", "control service is unavailable");
      const workspaceId = header(request, "x-workspace-id");
      header(request, "x-principal-id");
      return await controlService.get(workspaceId, request.params.controlId);
    } catch (error) { sendError(reply, error); return undefined; }
  });

'''
          marker = '  app.post("/api/cwos/accounts", async (request, reply) => {'
          if '/api/cwos/governance/requests' not in text:
              if marker not in text:
                  raise SystemExit('accounts route anchor not found')
              text = text.replace(marker, governance_routes + marker)
          routes.write_text(text)

          Path('.github/workflows/cwos-one-shot-controls-integration.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api .github/workflows/cwos-one-shot-controls-integration.yml
          git commit -m "fix(cwos): integrate governed control lifecycle"
          git push origin HEAD:feat/customer-work-os-v1-full
