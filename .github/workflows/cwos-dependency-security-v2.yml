name: CWOS Dependency Security V2

on:
  push:
    branches:
      - chore/cwos-v1-dependency-security-v2

permissions:
  contents: write

concurrency:
  group: cwos-dependency-security-v2
  cancel-in-progress: true

jobs:
  update-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/cwos-v1-dependency-security-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Resolve patched dependency graph
        run: pnpm install --no-frozen-lockfile
      - name: Workspace regression
        run: pnpm check
      - name: Package builds
        run: pnpm -r --if-present run build
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Commit lockfile and remove temporary workflow
        run: |
          rm .github/workflows/cwos-dependency-security-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/cwos-dependency-security-v2.yml
          git commit -m "fix(deps): lock secure graph from current stabilization"
          git push origin HEAD:chore/cwos-v1-dependency-security-v2
