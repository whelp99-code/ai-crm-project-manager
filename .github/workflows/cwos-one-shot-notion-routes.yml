name: CWOS One Shot Notion Routes

on:
  push:
    branches:
      - feat/customer-work-os-v1-full

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'feat(cwos): expose governed Notion migration API') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-work-os-v1-full
          fetch-depth: 0
      - name: Patch Notion route integration
        run: |
          python - <<'PY'
          from pathlib import Path
          routes = Path('apps/api/src/customer-work-os-routes-durable.ts')
          text = routes.read_text()
          imports = '''import { notionCwosHash, type NotionCwosSnapshot } from "@ai-crm/imports";
import {
  CustomerWorkOsNotionService,
  InMemoryNotionPlanStore,
  applyNotionPlanToDomain,
  createPgNotionPlanStoreFromEnvironment,
  type NotionPlanStore,
} from "./customer-work-os-notion.js";
'''
          anchor = 'import { buildOwnerCockpit } from "@ai-crm/reports/customer-work-os-reports";\n'
          if imports not in text:
              if anchor not in text:
                  raise SystemExit('reports import anchor not found')
              text = text.replace(anchor, anchor + imports)
          text = text.replace(
              '  controls?: CustomerWorkOsControlService;\n  now?: () => string;',
              '  controls?: CustomerWorkOsControlService;\n  notionStore?: NotionPlanStore;\n  now?: () => string;',
          )
          setup_anchor = '''  const controlService = options.controls ?? await createPgCustomerWorkOsControlServiceFromEnvironment();
  const approvals = options.approvals ?? controlService ?? infrastructure?.approvals;
  const manager = new CustomerWorkOsRuntimeManager(store);
  const now = options.now ?? (() => new Date().toISOString());'''
          setup_new = '''  const controlService = options.controls ?? await createPgCustomerWorkOsControlServiceFromEnvironment();
  const approvals = options.approvals ?? controlService ?? infrastructure?.approvals;
  const notionStore = options.notionStore ?? await createPgNotionPlanStoreFromEnvironment() ?? new InMemoryNotionPlanStore();
  const now = options.now ?? (() => new Date().toISOString());
  const notionService = new CustomerWorkOsNotionService(notionStore, now);
  const manager = new CustomerWorkOsRuntimeManager(store);'''
          if setup_anchor not in text:
              raise SystemExit('route setup anchor not found')
          text = text.replace(setup_anchor, setup_new)
          close_anchor = '  if (controlService && controlService !== options.controls) app.addHook("onClose", async () => controlService.close?.());'
          close_new = close_anchor + '\n  if (notionStore !== options.notionStore) app.addHook("onClose", async () => notionStore.close?.());'
          text = text.replace(close_anchor, close_new)
          block = '''
  app.post("/api/cwos/notion/plans", async (request, reply) => {
    try {
      const workspaceId = header(request, "x-workspace-id");
      const principalId = header(request, "x-principal-id");
      const body = bodyObject(request);
      const snapshot = body.snapshot;
      if (!snapshot || typeof snapshot !== "object" || Array.isArray(snapshot)) throw new CustomerWorkOsError("INVALID_INPUT", "snapshot object is required");
      if ((snapshot as { workspaceId?: unknown }).workspaceId !== workspaceId) throw new CustomerWorkOsError("CROSS_WORKSPACE", "Notion snapshot workspace does not match authenticated workspace");
      const plan = await notionService.plan(snapshot as unknown as NotionCwosSnapshot, principalId);
      reply.code(201).send(plan);
    } catch (error) { sendError(reply, error); }
  });

  app.get("/api/cwos/notion/plans", async (request, reply) => {
    try {
      const workspaceId = header(request, "x-workspace-id"); header(request, "x-principal-id");
      return await notionService.list(workspaceId);
    } catch (error) { sendError(reply, error); return undefined; }
  });

  app.get<{ Params: { planId: string } }>("/api/cwos/notion/plans/:planId", async (request, reply) => {
    try {
      const workspaceId = header(request, "x-workspace-id"); header(request, "x-principal-id");
      const plan = await notionService.get(workspaceId, request.params.planId);
      if (!plan) throw new CustomerWorkOsError("NOT_FOUND", `Notion plan not found: ${request.params.planId}`);
      return plan;
    } catch (error) { sendError(reply, error); return undefined; }
  });

  app.post<{ Params: { planId: string } }>("/api/cwos/notion/plans/:planId/approve", async (request, reply) => {
    try {
      const workspaceId = header(request, "x-workspace-id"); const principalId = header(request, "x-principal-id"); const body = bodyObject(request);
      const current = await notionService.get(workspaceId, request.params.planId);
      if (!current) throw new CustomerWorkOsError("NOT_FOUND", `Notion plan not found: ${request.params.planId}`);
      const expectedVersion = numberField(body, "expectedVersion");
      const payloadHash = notionCwosHash({ planId: current.id, planHash: current.planHash, quarantine: current.plan.reconciliation.quarantined, orphanRelations: current.plan.reconciliation.orphanRelations, duplicateCandidates: current.plan.reconciliation.duplicateCandidates });
      const receipt = await resolveApproval({ workspaceId, approvalId: approvalId(body), resourceType: "import_plan", resourceId: current.id, resourceVersion: expectedVersion, action: "NOTION_IMPORT_APPROVE", payloadHash });
      const updated = await notionService.approve(workspaceId, current.id, expectedVersion, principalId, receipt, stringField(body, "reason"));
      reply.code(200).send(updated);
    } catch (error) { sendError(reply, error); }
  });

  app.post<{ Params: { planId: string } }>("/api/cwos/notion/plans/:planId/apply", async (request, reply) => {
    try {
      const workspaceId = header(request, "x-workspace-id"); const principalId = header(request, "x-principal-id"); const idempotencyKey = header(request, "idempotency-key"); const body = bodyObject(request);
      const current = await notionService.get(workspaceId, request.params.planId);
      if (!current) throw new CustomerWorkOsError("NOT_FOUND", `Notion plan not found: ${request.params.planId}`);
      if (current.status === "APPLIED") { reply.code(200).send({ plan: current, alreadyApplied: true }); return; }
      if (current.status !== "APPROVED") throw new CustomerWorkOsError("INVALID_STATE", "Notion plan must be APPROVED before apply");
      const expectedVersion = numberField(body, "expectedVersion");
      const payloadHash = customerWorkOsPayloadHash({ planId: current.id, planVersion: expectedVersion, planHash: current.planHash });
      const receipt = await resolveApproval({ workspaceId, approvalId: approvalId(body), resourceType: "import_plan", resourceId: current.id, resourceVersion: expectedVersion, action: "NOTION_IMPORT_APPLY", payloadHash });
      const requestHash = customerWorkOsPayloadHash({ route: "notion.apply", workspaceId, principalId, planId: current.id, expectedVersion, planHash: current.planHash });
      const applied = await manager.mutate({
        workspaceId, principalId, idempotencyKey, requestHash, operationId: "notion.apply", now: now(),
        operation: (service) => applyNotionPlanToDomain({ service, record: current, principalId, receipt }),
      });
      const plan = await notionService.markApplied(workspaceId, current.id, expectedVersion, principalId, stringField(body, "reason"));
      reply.header("x-idempotent-replay", applied.replayed ? "true" : "false").code(200).send({ plan, result: applied.payload });
    } catch (error) { sendError(reply, error); }
  });

'''
          marker = '  app.post("/api/cwos/governance/requests", async (request, reply) => {'
          if '"/api/cwos/notion/plans"' not in text:
              if marker not in text:
                  raise SystemExit('governance route anchor not found')
              text = text.replace(marker, block + marker)
          routes.write_text(text)
          Path('.github/workflows/cwos-one-shot-notion-routes.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api .github/workflows/cwos-one-shot-notion-routes.yml
          git commit -m "feat(cwos): expose governed Notion migration API"
          git push origin HEAD:feat/customer-work-os-v1-full
