name: CWOS Fix Notion Optional Fields

on:
  push:
    branches:
      - feat/customer-work-os-v1-full

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-work-os-v1-full
          fetch-depth: 0
      - name: Apply deterministic import repair
        run: python scripts/fix-notion-cwos-optionals.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/imports/src/notion-cwos.ts scripts/fix-notion-cwos-optionals.py .github/workflows/cwos-fix-notion-optionals.yml
          git commit -m "fix(cwos): narrow optional Notion import fields"
          git push origin HEAD:feat/customer-work-os-v1-full
