name: CWOS One Shot Lockfile

on:
  push:
    branches:
      - feat/customer-work-os-v1-full

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, 'chore(cwos): synchronize workspace lockfile') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-work-os-v1-full
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Regenerate lockfile from workspace manifests
        run: pnpm install --lockfile-only
      - name: Verify frozen install
        run: pnpm install --frozen-lockfile
      - name: Commit when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(cwos): synchronize workspace lockfile"
            git push origin HEAD:feat/customer-work-os-v1-full
          fi
          rm .github/workflows/cwos-one-shot-lockfile.yml
          git add .github/workflows/cwos-one-shot-lockfile.yml
          git commit -m "chore(cwos): remove one-shot lockfile workflow"
          git push origin HEAD:feat/customer-work-os-v1-full
